name: tts-test
on: [workflow_dispatch, push]
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chatterbox TTS
        run: pip install chatterbox-tts
      - name: Synthesize narration
        run: |
          python - <<'PY'
          import torch
          from chatterbox.tts import Chatterbox
          model = Chatterbox.load_from_pretrained(device="cpu")
          text = open("test_narration.txt").read().strip()
          wav = model.generate(text, exaggeration=0.4, cfg_weight=0.35)
          import torchaudio
          torchaudio.save("narration.wav", wav.cpu(), model.sr)
          print("saved", wav.shape, model.sr)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: narration-test
          path: narration.wav
          retention-days: 3
