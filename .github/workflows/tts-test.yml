name: tts-test
on: [workflow_dispatch, push]
jobs:
  tts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: diag
        run: |
          echo "python: $(python3 --version)"
          python3 -m pip install --upgrade pip 2>&1 | tail -1
          python3 -m pip install "chatterbox-tts==0.1.7" 2>&1 | tail -3
